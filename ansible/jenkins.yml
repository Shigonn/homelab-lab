- name: Jenkins on the jenkins VM
  hosts: jenkins
  become: true
  tasks:
    - name: Prerequisites (Java 21, fontconfig, deb822 support)
      ansible.builtin.apt:
        name:
          - openjdk-21-jre-headless
          - fontconfig
          - python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Jenkins apt repo (LTS, deb822)
      ansible.builtin.deb822_repository:
        name: jenkins
        types: deb
        uris: https://pkg.jenkins.io/debian-stable
        suites: binary/
        signed_by: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Enable and start Jenkins
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true

    - name: Wait for Jenkins to listen on 8080
      ansible.builtin.wait_for:
        port: 8080
        timeout: 240
