- name: Node exporter on all lab VMs
  hosts: lab
  become: true
  tasks:
    - name: Install node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start node exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true
  bad: [unclosed
